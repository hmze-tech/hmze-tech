name: Sync podcast episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

# Least privilege by default; the job below opts into the write it needs.
permissions:
  contents: read

# Never let two syncs push concurrently (scheduled + manual dispatch could
# otherwise race on the auto-push and clobber each other).
concurrency:
  group: sync-podcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Pinned to the v6.0.3 commit SHA (mutable tags can be repointed).
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          # Do not leave the push token in .git/config while the steps below
          # run untrusted-feed-derived code; the push step re-authenticates.
          persist-credentials: false

      - name: Setup Node
        # Pinned to the v6.4.0 commit SHA.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # Exact, integrity-checked install from the committed lockfile with
        # install scripts disabled (no arbitrary code at install time).
        run: npm ci --ignore-scripts

      - name: Generate missing episode posts
        run: node scripts/sync-podcast.js

      - name: Check for new posts
        id: changes
        run: |
          git add _posts
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new episodes found."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New episodes detected."
          fi

      - name: Commit new posts
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add new podcast episodes"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
