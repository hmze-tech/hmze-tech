# Single source of truth for all platform links across the site.
#
# Consumers:
#   _includes/nav.html, _includes/footer.html  — every entry (header pill, footer icons)
#   _layouts/home.html, _layouts/podcast_post.md — entries with `player: true`
#
# `player: true` marks the listening apps shown in the compact platform rows
# next to an episode player. RSS and LinkedIn stay out of those rows; they
# still appear in the header pill and footer.

